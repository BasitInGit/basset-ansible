---
- name: deploy basset aplication
  hosts: webserver
  tasks: 
    - name: install httpd
      yum:
        name: httpd
        state: latest

    - name: start httpd service
      service:
        name: httpd
        state: started

    - name: create index.html
      command: touch /var/www/html/index.html

    - name: deploy application
      shell: echo "Welcome to DevOps Training" > /var/www/html/index.html
